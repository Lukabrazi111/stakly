name: linter

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm install

      # All three quality gates run in `*:check` (non-autofix) mode. The
      # previous setup ran `pint`, `prettier --write`, and `eslint --fix`
      # — which silently rewrite files on CI then throw the changes away
      # (auto-commit step was never enabled). `eslint --fix` was also the
      # only one that could fail CI, masking style drift in PHP + frontend
      # behind a one-sided JS-only signal. Check variants exit non-zero on
      # any drift so the failure mode is uniform across all three.

      - name: Pint (check only)
        run: composer lint:check

      - name: Prettier (check only)
        run: npm run format:check

      - name: ESLint (check only)
        run: npm run lint:check

      - name: TypeScript (no emit)
        run: npm run types:check
