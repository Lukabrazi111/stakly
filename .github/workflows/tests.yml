name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 8.3 dropped — composer.lock pins Symfony 8.x which requires
        # `php >=8.4`. The `composer.json` `^8.3` constraint is stale and
        # not satisfiable; testing on 8.3 fails at `composer install`.
        php-version: ['8.4', '8.5']

    # Matches the local Sail Postgres 18 service. Tests rely on Postgres-
    # specific features (jsonb, AsEnumCollection casts, whereJsonContains
    # in queries) that don't translate cleanly to SQLite, so CI runs the
    # real engine. `POSTGRES_DB=testing` aligns with phpunit.xml's
    # `<env name="DB_DATABASE" value="testing"/>` override.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Job-level env wins over `.env` contents (Dotenv doesn't override
    # existing env vars), so the SQLite default in `.env.example` is
    # superseded by the Postgres config below for both `migrate` and `pest`.
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          # `bcmath` — Wallet service money math (bcadd / bcsub / bccomp / bcmul).
          # `pgsql` + `pdo_pgsql` — Postgres driver for tests.
          # `gd` — Spatie Image conversions used by chat attachment thumbnails.
          extensions: bcmath, pgsql, pdo_pgsql, gd
          tools: composer:v2
          # No coverage collected currently, so skip xdebug — it slows pest
          # ~3x without benefit. Re-enable when coverage reporting lands.
          coverage: none

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Migrate Database
        run: php artisan migrate --force --no-interaction

      - name: Tests
        run: ./vendor/bin/pest
