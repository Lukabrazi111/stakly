services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
            - redis
            - mailpit
    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
    reverb:
        image: 'sail-8.5/app'
        command: 'php artisan reverb:start --host=0.0.0.0 --port=8080'
        ports:
            - '${REVERB_SERVER_PORT:-8080}:8080'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - laravel.test
            - redis
    queue:
        # `ShouldBroadcast` events (and other queued jobs) need a worker to
        # actually fire. Without this container the `jobs` table fills up and
        # broadcasts never reach Reverb. `queue:listen` (not `queue:work`)
        # reloads code per job so dev edits to event classes pick up without
        # a manual worker restart.
        image: 'sail-8.5/app'
        command: 'php artisan queue:listen --tries=1 --timeout=0'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - laravel.test
            - pgsql
            - redis
    ssr:
        # M26 Phase 3 — Inertia SSR sidecar. Runs `php artisan inertia:start-ssr`
        # which boots the Node process from `bootstrap/ssr/ssr.js` and serves
        # rendered HTML to the laravel.test container on port 13714.
        #
        # Profile-gated so `sail up` doesn't auto-start it before the SSR
        # bundle exists — `inertia:start-ssr` exits when there's no bundle,
        # which without a profile would surface as a confusing "exited"
        # container in `docker compose ps`. Run `sail npm run build:ssr`
        # first; once the bundle is present add `COMPOSE_PROFILES=ssr` to
        # `.env` (or pass `--profile ssr` to `sail up`) and the sidecar
        # becomes part of the default stack.
        #
        # When the sidecar is NOT running, Inertia falls back to client
        # rendering — pages still work, just no SSR (no SEO, blank link
        # previews). In production deploys, drop the `profiles` block so
        # this service always runs.
        image: 'sail-8.5/app'
        command: 'php artisan inertia:start-ssr'
        restart: unless-stopped
        profiles:
            - ssr
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - laravel.test
    scheduler:
        # Long-running Laravel scheduler. Reads every `Schedule::command(...)`
        # entry in `routes/console.php` and fires them at their configured
        # cadence (`->everyMinute()`, `->hourly()`, etc.).
        #
        # `schedule:work` is the container-friendly alternative to a host-cron
        # `* * * * * php artisan schedule:run` entry — it sleeps internally and
        # loops, so it doesn't need a `cron` daemon installed. One process per
        # container, matches the `queue` / `reverb` / `lichess-stream` pattern.
        #
        # Adding a new scheduled command? Just add a `Schedule::command(...)`
        # line in `routes/console.php` — this container picks it up on the
        # next minute without a restart.
        image: 'sail-8.5/app'
        command: 'php artisan schedule:work'
        restart: unless-stopped
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - laravel.test
            - pgsql
            - redis
    lichess-stream:
        # M16 Phase 4 — long-lived consumer of Lichess's
        # `/api/stream/games-by-users` NDJSON stream. Dispatches
        # `AutoFetchLichessGameJob` the instant a game between two
        # subscribed Pending-match players ends. Optimization on top of
        # the Phase 2 cron — if this container is stopped, settlement
        # still happens within ~5min via the cron backstop.
        #
        # `restart: unless-stopped` so a crash auto-restarts. The
        # daemon's own reconnect loop handles transient Lichess
        # connection drops; restart kicks in only on PHP-level fatal
        # exits.
        image: 'sail-8.5/app'
        command: 'php artisan stakly:lichess-stream'
        restart: unless-stopped
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - laravel.test
            - pgsql
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
